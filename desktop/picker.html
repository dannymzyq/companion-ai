<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Compartir pantalla</title>
<style>
  :root { color-scheme: dark; --line: rgba(255, 255, 255, 0.12); --accent: #a78bfa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: #0c0b14; color: #ece9f6;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  header { padding: 18px 22px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; }
  header p { margin: 0; color: #a8a3bd; font-size: 0.85rem; }
  .toolbar { display: flex; align-items: center; gap: 8px; }
  #filter {
    padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
    color: inherit; font: inherit; font-size: 0.82rem; outline: none; width: 200px;
  }
  #filter:focus { border-color: var(--accent); }
  #refresh {
    font: inherit; color: inherit; font-size: 0.82rem; padding: 7px 13px; border-radius: 99px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); cursor: pointer;
  }
  #refresh:hover { background: rgba(255, 255, 255, 0.12); }
  main { flex: 1; overflow-y: auto; padding: 4px 22px 16px; }
  h2 { margin: 16px 0 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f8aa6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    display: flex; flex-direction: column; gap: 7px; padding: 8px; text-align: left; font: inherit; color: inherit; cursor: pointer;
    border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); background: rgba(167, 139, 250, 0.16); outline: none; }
  .thumb { width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: #000; display: grid; place-items: center; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .thumb span { color: #6f6a85; font-size: 0.75rem; }
  .name { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: #8f8aa6; font-size: 0.85rem; }
  footer { display: flex; align-items: center; gap: 16px; padding: 12px 22px; border-top: 1px solid var(--line); }
  #sound { flex: 1; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  #sound[hidden] { display: none; }
  #sound input { position: absolute; opacity: 0; pointer-events: none; }
  #sound .switch { flex: none; width: 36px; height: 20px; margin-top: 1px; border-radius: 99px; background: rgba(255, 255, 255, 0.18); position: relative; transition: background 0.15s; }
  #sound .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  #sound input:checked + .switch { background: var(--accent); }
  #sound input:checked + .switch::after { transform: translateX(16px); }
  #sound input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
  #sound b { display: block; font-weight: 600; font-size: 0.88rem; }
  #sound small { display: block; color: #a8a3bd; font-size: 0.76rem; }
  .spacer { flex: 1; }
  #cancel { font: inherit; color: inherit; padding: 8px 18px; border-radius: 99px; border: 1px solid var(--line); background: none; cursor: pointer; }
  #cancel:hover { background: rgba(255, 255, 255, 0.08); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>¿Qué quieres compartir?</h1>
      <p>Solo se verá la pantalla o la ventana que elijas aquí, nada más.</p>
    </div>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filtrar ventanas…" aria-label="Filtrar ventanas">
      <button id="refresh" type="button" title="Actualizar miniaturas">↻ Actualizar</button>
    </div>
  </header>
  <main>
    <h2>Pantallas</h2>
    <div class="grid" id="screens"></div>
    <h2>Ventanas</h2>
    <div class="grid" id="windows"></div>
  </main>
  <footer>
    <label id="sound" hidden>
      <input type="checkbox" id="sound-on">
      <span class="switch" aria-hidden="true"></span>
      <span><b>Escuchar también el sonido</b>
        <small>También se oye lo que suena en la PC (vídeos, juegos, llamadas) para entender mejor lo que compartes. Es el sonido de toda la PC, no solo de esa ventana.</small></span>
    </label>
    <span class="spacer" id="spacer"></span>
    <button id="cancel">Cancelar</button>
  </footer>
<script>
  let allSources = [];
  const card = (s) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.id = s.id;
    b.title = s.name;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (s.thumbnail) {
      const img = document.createElement('img');
      img.src = s.thumbnail;
      img.alt = '';
      thumb.append(img);
    } else {
      const none = document.createElement('span');
      none.textContent = 'Sin vista previa';
      thumb.append(none);
    }
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = s.name;
    b.append(thumb, name);
    b.onclick = () => window.picker.choose(s.id, document.getElementById('sound-on').checked);
    return b;
  };
  const fill = (id, list, empty) => {
    const box = document.getElementById(id);
    box.replaceChildren(...list.map(card));
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = empty;
      box.append(p);
    }
  };
  const render = () => {
    const q = (document.getElementById('filter').value || '').trim().toLowerCase();
    const match = (s) => !q || s.name.toLowerCase().includes(q);
    fill('screens', allSources.filter((s) => s.kind === 'screen' && match(s)), 'No encontré ninguna pantalla.');
    fill('windows', allSources.filter((s) => s.kind === 'window' && match(s)), q ? 'Ninguna ventana coincide con el filtro.' : 'No hay ventanas abiertas para compartir.');
  };
  window.picker.options().then((o) => {
    if (!o || !o.audio) return;
    document.getElementById('sound').hidden = false;
    document.getElementById('spacer').hidden = true;
    document.getElementById('sound-on').checked = !!o.audioOn;
  });
  window.picker.sources().then((list) => {
    allSources = list || [];
    render();
    document.body.dataset.ready = '1';
  });
  document.getElementById('filter').oninput = render;
  document.getElementById('refresh').onclick = async () => {
    if (!window.picker.refresh) return;
    const btn = document.getElementById('refresh');
    btn.disabled = true;
    try { allSources = (await window.picker.refresh()) || allSources; render(); }
    finally { btn.disabled = false; }
  };
  document.getElementById('cancel').onclick = () => window.picker.cancel();
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.cancel(); });
</script>
</body>
</html>
