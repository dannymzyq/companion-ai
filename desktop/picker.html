<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Compartir con Mika</title>
<style>
  :root { color-scheme: dark; --line: rgba(255, 255, 255, 0.12); --accent: #a78bfa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: #0c0b14; color: #ece9f6;
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  header { padding: 18px 22px 10px; }
  h1 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; }
  header p { margin: 0; color: #a8a3bd; font-size: 0.85rem; }
  main { flex: 1; overflow-y: auto; padding: 4px 22px 16px; }
  h2 { margin: 16px 0 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8f8aa6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    display: flex; flex-direction: column; gap: 7px; padding: 8px; text-align: left; font: inherit; color: inherit; cursor: pointer;
    border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); background: rgba(167, 139, 250, 0.16); outline: none; }
  .thumb { width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: #000; display: grid; place-items: center; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .thumb span { color: #6f6a85; font-size: 0.75rem; }
  .name { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: #8f8aa6; font-size: 0.85rem; }
  footer { display: flex; justify-content: flex-end; padding: 12px 22px; border-top: 1px solid var(--line); }
  #cancel { font: inherit; color: inherit; padding: 8px 18px; border-radius: 99px; border: 1px solid var(--line); background: none; cursor: pointer; }
  #cancel:hover { background: rgba(255, 255, 255, 0.08); }
</style>
</head>
<body>
  <header>
    <h1>¿Qué quieres que vea Mika?</h1>
    <p>Mika solo verá la pantalla o la ventana que elijas aquí, nada más.</p>
  </header>
  <main>
    <h2>Pantallas</h2>
    <div class="grid" id="screens"></div>
    <h2>Ventanas</h2>
    <div class="grid" id="windows"></div>
  </main>
  <footer><button id="cancel">Cancelar</button></footer>
<script>
  const card = (s) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.dataset.id = s.id;
    b.title = s.name;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (s.thumbnail) {
      const img = document.createElement('img');
      img.src = s.thumbnail;
      img.alt = '';
      thumb.append(img);
    } else {
      const none = document.createElement('span');
      none.textContent = 'Sin vista previa';
      thumb.append(none);
    }
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = s.name;           // el título de una ventana es texto ajeno: nunca como HTML
    b.append(thumb, name);
    b.onclick = () => window.picker.choose(s.id);
    return b;
  };
  const fill = (id, list, empty) => {
    const box = document.getElementById(id);
    box.replaceChildren(...list.map(card));
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = empty;
      box.append(p);
    }
  };
  window.picker.sources().then((list) => {
    fill('screens', list.filter((s) => s.kind === 'screen'), 'No encontré ninguna pantalla.');
    fill('windows', list.filter((s) => s.kind === 'window'), 'No hay ventanas abiertas para compartir.');
    document.body.dataset.ready = '1';
  });
  document.getElementById('cancel').onclick = () => window.picker.cancel();
  addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.cancel(); });
</script>
</body>
</html>
