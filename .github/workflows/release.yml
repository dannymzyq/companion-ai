# Publica un Release al subir una etiqueta vX.Y.Z: crea el instalador (dist\Companion-Setup-X.Y.Z.exe) con
# scripts\instalacion\crear_instalador.ps1 y lo adjunta, con las notas de esa versión sacadas de CHANGELOG.md.
#   git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    outputs:
      mac: ${{ steps.notas.outputs.mac }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la versión
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION dice $v pero la etiqueta es ${{ github.ref_name }}" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Las pruebas rápidas (tests\), como en el Mac: si alguna falla no se publica nada. El entorno va fuera de la
      # carpeta del proyecto para que no acabe en el paquete.
      - name: Pruebas rápidas
        shell: powershell
        run: |
          python -m pip install --quiet uv==0.13.8
          $venv = Join-Path $env:RUNNER_TEMP "venv"
          uv venv --python 3.13 $venv
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el entorno" }
          uv pip install --python "$venv\Scripts\python.exe" -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron instalar las dependencias" }
          & "$venv\Scripts\python.exe" -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas rápidas: no se publica el Release" }

      - name: Crear el instalador
        shell: powershell
        run: ./scripts/instalacion/crear_instalador.ps1

      # Una versión cuyo título en CHANGELOG.md dice «(solo Windows)» no crea la app para Mac (una corrección que
      # solo afecta a Windows).
      - name: Notas de la versión
        id: notas
        shell: powershell
        run: |
          $texto = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($texto, "(?ms)^## $([regex]::Escape($env:VERSION))\b([^\n]*)\n(.*?)(?=^## |\z)")
          $notas = if ($m.Success) { $m.Groups[2].Value.Trim() } else { "Versión $env:VERSION." }
          $mac = -not ($m.Success -and $m.Groups[1].Value -match '(?i)solo Windows')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mac=$($mac.ToString().ToLower())" -Encoding ascii   # sin BOM
          $notas += "`n`n**Instalar o actualizar en Windows:** descarga ``Companion-Setup-$env:VERSION.exe`` y ábrelo. Si ya lo tienes instalado, encuentra la carpeta y copia solo lo que cambió (tus datos, voces y personajes se conservan)."
          if ($mac) { $notas += "`n`n**Mac con Apple Silicon (macOS 14 o posterior):** descarga ``Companion-$env:VERSION-mac.dmg``, arrastra Companion a Aplicaciones y ábrelo. No está firmada por un desarrollador de Apple: la primera vez ve a Ajustes del Sistema › Privacidad y seguridad › «Abrir igualmente». El .dmg llega unos minutos después del .exe, cuando termina su prueba en un Mac." }
          else { $notas += "`n`nEsta corrección es solo para Windows: en el Mac sigue valiendo el .dmg de la versión anterior." }
          [IO.File]::WriteAllText("notas.md", $notas, (New-Object Text.UTF8Encoding $false))

      - name: Publicar el Release con sumas SHA-256
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "dist/Companion-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$hash  Companion-Setup-$env:VERSION.exe`n", (New-Object Text.UTF8Encoding $false))
          gh release create "${{ github.ref_name }}" $exe "dist/SHA256SUMS.txt" --title "Companion $env:VERSION" --notes-file notas.md

  # La app para Mac se crea y se prueba en un Mac de GitHub (mac.yml) y se añade al mismo Release.
  mac:
    needs: instalador
    if: needs.instalador.outputs.mac == 'true'
    uses: ./.github/workflows/mac.yml
    with:
      publicar: true
    permissions:
      contents: write
