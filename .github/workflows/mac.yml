# App para Mac con Apple Silicon: crea dist/Companion-X.Y.Z-mac.dmg (scripts/crear_app_mac.sh) y la prueba en
# un Mac de GitHub como la usaría alguien: abre Companion.app, que instala todo en una carpeta propia y arranca
# el servidor; luego las pruebas rápidas, la voz ligera y la completa con el oído. Se lanza a mano (Actions ›
# Mac › Run workflow) o desde release.yml, que adjunta el .dmg al Release.
name: Mac

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publicar:
        description: "Adjuntar el .dmg al Release de la etiqueta"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-15            # Apple Silicon (M1); la app pide macOS 14 o posterior (macos-14 ya no existe en GitHub)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ inputs.publicar }}" = true ] && [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "VERSION dice $v pero la etiqueta es ${{ github.ref_name }}"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "CASA=$RUNNER_TEMP/casa" >> "$GITHUB_ENV"     # en vez de ~/Library/Application Support/Companion

      - name: Crear Companion.app y el .dmg
        run: bash scripts/crear_app_mac.sh

      - name: Abrir la app desde el .dmg (instala todo la primera vez)
        run: |
          hdiutil attach "dist/Companion-$VERSION-mac.dmg" -mountpoint /Volumes/Companion -nobrowse
          ditto /Volumes/Companion/Companion.app "$RUNNER_TEMP/Companion.app"
          hdiutil detach /Volumes/Companion
          codesign --verify --deep --strict "$RUNNER_TEMP/Companion.app"
          COMPANION_TEST=1 COMPANION_HOME="$CASA" "$RUNNER_TEMP/Companion.app/Contents/MacOS/Electron" > "$RUNNER_TEMP/electron.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/electron.pid"
          for i in $(seq 1 1500); do       # hasta 50 min: Python, librerías, Whisper y Piper
            if [ -f "$CASA/.instalado" ] && curl -fsS http://127.0.0.1:8200/api/config >/dev/null 2>&1; then break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/electron.pid")" 2>/dev/null; then echo "La app se cerró."; break; fi
            sleep 2
          done
          tail -25 "$CASA/data/instalacion.log" || true
          test "$(cat "$CASA/.instalado")" = "$VERSION"
          curl -fsS http://127.0.0.1:8200/api/config >/dev/null
          echo "Instalada y con el servidor en marcha."

      - name: La ventana del companion cargó la interfaz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9334/json | grep -q '"url": *"http://127.0.0.1:8200/'; then echo "Ventana abierta en el servidor."; exit 0; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9334/json || true
          exit 1

      - name: Pruebas rápidas
        working-directory: ${{ env.CASA }}
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -s tests -t . 2>&1 | tee "$RUNNER_TEMP/pruebas.log"

      - name: Voz ligera, detección de voz y oído (Whisper en el procesador)
        working-directory: ${{ env.CASA }}
        env:
          VOICE_ENGINE: ligera
        run: |
          set -o pipefail
          .venv/bin/python scripts/prueba_componentes.py 2>&1 | tee -a "$RUNNER_TEMP/pruebas.log"

      - name: Voz completa (F5-TTS con PyTorch para Mac)
        working-directory: ${{ env.CASA }}
        env:
          VOICE_ENGINE: completa
          TTS_URL: http://127.0.0.1:8211
        run: |
          bash instalar.sh --voz=completa --sin-ollama
          # En el procesador: la GPU paravirtual del Mac de GitHub se cuelga con Metal (en un Mac de verdad va en la GPU).
          VOZ_DISPOSITIVO=cpu voz/.venv/bin/python -m uvicorn servidor:app --app-dir voz --host 127.0.0.1 --port 8211 > "$RUNNER_TEMP/voz.log" 2>&1 &
          for i in $(seq 1 600); do        # hasta 20 min: en el procesador de un Mac virtual F5 carga despacio
            grep -q "F5-TTS listo" "$RUNNER_TEMP/voz.log" && break
            if curl -fsS http://127.0.0.1:8211/health | grep -q '"error": *"[^"]'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8211/health; echo
          grep "F5-TTS listo" "$RUNNER_TEMP/voz.log" || { echo "La voz completa no cargó"; exit 1; }
          # Una frase directa al servidor, con tiempo: en este Mac virtual va en el procesador y es lenta (la
          # velocidad de verdad, con la GPU, se mide en un Mac real); aquí se comprueba que suena.
          t0=$(date +%s)
          curl -fsS -m 900 -X POST http://127.0.0.1:8211/v1/audio/speech -H 'Content-Type: application/json'             -d '{"input": "Hola, esto es una prueba de la voz completa en un Mac.", "voice": "mika_es", "speed": 1.0}' -o "$RUNNER_TEMP/voz.pcm"
          bytes=$(wc -c < "$RUNNER_TEMP/voz.pcm")
          echo "Voz completa: $((bytes / 48000)) s de audio en $(( $(date +%s) - t0 )) s (procesador de un Mac virtual)"
          [ "$bytes" -gt 48000 ]

      - name: Cerrar
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/electron.pid" 2>/dev/null)" 2>/dev/null || true
          [ -f "$CASA/detener.sh" ] && bash "$CASA/detener.sh" || true

      - name: Registros (si algo falló)
        if: failure()
        run: |
          # También como anotaciones: se ven en el resumen de la ejecución sin iniciar sesión en GitHub.
          # (En una máquina de GitHub, sin datos de nadie: solo lo que dicen las pruebas.)
          for f in "$RUNNER_TEMP/pruebas.log" "$RUNNER_TEMP/electron.log" "$CASA/data/instalacion.log" "$CASA/data/companion.log" "$RUNNER_TEMP/voz.log"; do
            [ -f "$f" ] || continue
            echo "==== $f"; tail -80 "$f"
            texto="$(tail -40 "$f" | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::warning title=$(basename "$f")::$texto"
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: Companion-mac
          path: dist/Companion-*-mac.dmg
          retention-days: 14

      - name: Adjuntar al Release
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "dist/Companion-$VERSION-mac.dmg" --clobber
