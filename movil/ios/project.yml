# Proyecto de Xcode del companion para iOS. Se genera con XcodeGen (el .xcodeproj no va en git):
#   cd movil/ios && xcodegen
name: Companion
options:
  bundleIdPrefix: local.companion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Para instalarla en el iPhone: el equipo del Apple ID del usuario (Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
      - path: Motores
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: SherpaOnnx
        product: sherpa-onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.companion.app
        PRODUCT_NAME: Companion
        # COMPANION_FLAGS=PRUEBAS en la línea de órdenes: compilación de pruebas en el iPhone (gancho y tiempos).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(COMPANION_FLAGS)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Companion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Para que tu companion te oiga cuando le hablas."
        # La app no usa la cámara, pero WebKit puede consultarla: sin esta descripción iOS cierra la app.
        INFOPLIST_KEY_NSCameraUsageDescription: "Para que tu personaje te vea a ti o lo que tengas delante cuando activas la cámara."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Interfaz y núcleo (www)
        script: '"$SRCROOT/../scripts/bundle_web.sh"'
        basedOnDependencyAnalysis: false
  ProbarMotores:
    # Herramienta del Mac para medir los motores del modo teléfono con los mismos archivos de Motores/.
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Motores
      - path: ProbarMotores
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: SherpaOnnx
        product: sherpa-onnx
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: probar_motores
        CODE_SIGN_IDENTITY: "-"
