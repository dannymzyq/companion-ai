# Proyecto de Xcode del companion para iOS. Se genera con XcodeGen (el .xcodeproj no va en git):
#   cd movil/ios && xcodegen
name: Companion
options:
  bundleIdPrefix: local.companion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Para instalarla en el iPhone: el equipo del Apple ID del usuario (Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.companion.app
        PRODUCT_NAME: Companion
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Companion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Para que tu companion te oiga cuando le hablas."
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Interfaz y núcleo (www)
        script: '"$SRCROOT/../scripts/bundle_web.sh"'
        basedOnDependencyAnalysis: false
